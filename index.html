<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular Footwear</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<section class="hero">

    <nav>
    <div class="logo">Popular Footwear</div>

    <ul class="Gender">
        <li><a href="gender/men.html">Men</a></li>
        <li><a href="gender/women.html">Women</a></li>
        <li><a href="gender/kids.html">Kids</a></li>
    </ul>

    <ul class="nav-links">
        <li><a href="nav-components/about.html">About</a></li>
        <li><a href="nav-components/contact.html">Contact Us</a></li>
        <li><a href="nav-components/cart.html">Cart 🛒</a></li>
        <li><a href="nav-components/login.html">Login</a></li>
    </ul>
</nav>

    <section class="offer">
        <div class="offer-text">
            <h3>Exclusive Offers for</h3>
            <p>Get ready for the rainy season with our exclusive deals!</p>
        </div>
        <button class="shop-now">Shop Now</button>
    </section>

</section>

<section class="brands">
    <h2>Popular Brands</h2>

    <div class="brand-slider">
        <div class="brand-track">

            <div class="brand-logo">
                <img src="imgs/Nike.png" alt="Nike">
            </div>

            <div class="brand-logo">
                <img src="imgs/Adidas.png" alt="Adidas">
            </div>

            <div class="brand-logo">
                <img src="imgs/Puma.png" alt="Puma">
            </div>

            <div class="brand-logo">
                <img src="imgs/Reebok.png" alt="Reebok">
            </div>

            <div class="brand-logo">
                <img src="imgs/Skechers.png" alt="Skechers">
            </div>

            <div class="brand-logo">
                <img src="imgs/Bata.png" alt="Bata">
            </div>

            <div class="brand-logo">
                <img src="imgs/Sparx.png" alt="Sparx">
            </div>

            <div class="brand-logo">
                <img src="imgs/VKC.png" alt="VKC">
            </div>

            <div class="brand-logo">
                <img src="imgs/Walkaroo.png" alt="Walkaroo">
            </div>

            <div class="brand-logo">
                <img src="imgs/Paragon.png" alt="Paragon">
            </div>

        </div>
    </div>
</section>

<div id="products">

    <h1>Our Products</h1>

    <div class="product">
        <a href="product/product.html?product=Shoes" alt="Shoes">
            <img src="products/shoe.avif" alt="Shoes">
        </a>
        <figcaption>Shoes</figcaption>
        <figcaption>Men</figcaption>
        <figcaption>₹50</figcaption>
        <button class="add-to-cart" data-product="Shoes">🛒</button>
    </div>

    <div class="product">
        <a href="product/product.html?product=Sneakers" alt="Sneakers">
            <img src="products/Sneakers.webp" alt="Sneakers">
        </a>
        <figcaption>Sneakers</figcaption>
        <figcaption>Women</figcaption>
        <figcaption>₹60</figcaption>
        <button class="add-to-cart" data-product="Sneakers">🛒</button>
    </div>

    <div class="product">
        <a href="product/product.html?product=Kids Shoes" alt="Kids Shoes">
            <img src="products/kids shoes.jpg" alt="Kids Shoes">
        </a>
        <figcaption>Kids Shoes</figcaption>
        <figcaption>Kids</figcaption>
        <figcaption>₹40</figcaption>
        <button class="add-to-cart" data-product="Kids Shoes">🛒</button>
    </div>

    <div class="product">
        <a href="product/product.html?product=Running Shoes" alt="Running Shoes">
            <img src="products/Running-Shoes.jpg" alt="Running Shoes">
        </a>
        <figcaption>Running Shoes</figcaption>
        <figcaption>Unisex</figcaption>
        <figcaption>₹80</figcaption>
        <button class="add-to-cart" data-product="Running Shoes">🛒</button>
    </div>

</div>

</footer>
